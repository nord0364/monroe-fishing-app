<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meerkat Dance</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; overflow: hidden; }
#container { position: relative; width: 800px; height: 480px; overflow: hidden; }
#start-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: #fff; cursor: pointer; }
#start-screen h1 { font-size: 2.5em; margin-bottom: 0.5em; text-shadow: 0 0 20px #f90; }
#start-screen p { font-size: 1.2em; color: #ccc; }
#start-btn { margin-top: 1.5em; padding: 0.7em 2em; font-size: 1.3em; border-radius: 30px; border: none; background: linear-gradient(135deg, #f90, #f60); color: #fff; cursor: pointer; box-shadow: 0 4px 20px rgba(255,150,0,0.5); }
#start-btn:hover { background: linear-gradient(135deg, #ffb300, #f70); }
#stage { position: relative; width: 800px; height: 480px; }
.bg { position: absolute; inset: 0; opacity: 0; transition: opacity 1s; pointer-events: none; }
.bg.active { opacity: 1; }
#bg-madagascar { background: linear-gradient(180deg, #87CEEB 0%, #b0e0ff 55%, #6ab04c 55%, #5a9640 100%); }
#bg-jungle { background: linear-gradient(180deg, #1a472a 0%, #2d6a4f 40%, #1a3a1a 40%, #145214 100%); }
#bg-desert { background: linear-gradient(180deg, #f0c040 0%, #e8a020 50%, #c8802a 50%, #a06010 100%); }
#bg-mountains { background: linear-gradient(180deg, #b0c8e0 0%, #8090a8 50%, #606878 50%, #404858 100%); }
svg#main { position: absolute; top: 0; left: 0; width: 800px; height: 480px; }
#biome-decorations { position: absolute; top: 0; left: 0; width: 800px; height: 480px; pointer-events: none; }
#music-notes-layer { position: absolute; top: 0; left: 0; width: 800px; height: 480px; pointer-events: none; z-index: 20; }
#finale-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; z-index: 30; }
#finale-text span { font-size: 3.5em; font-weight: 900; color: #fff; text-shadow: 0 0 30px #f90, 0 0 60px #f60; transform: scale(0); display: inline-block; }
#end-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50; color: #fff; }
#end-screen h2 { font-size: 3em; margin-bottom: 0.5em; }
#watch-again { padding: 0.7em 2em; font-size: 1.2em; border-radius: 20px; border: none; background: linear-gradient(135deg, #f90, #f60); color: #fff; cursor: pointer; }
.shake { animation: shake 0.4s ease; }
@keyframes shake {
  0%,100% { transform: translateX(0) translateY(0); }
  15% { transform: translateX(-6px) translateY(3px); }
  30% { transform: translateX(5px) translateY(-4px); }
  45% { transform: translateX(-4px) translateY(5px); }
  60% { transform: translateX(6px) translateY(-3px); }
  75% { transform: translateX(-3px) translateY(4px); }
  90% { transform: translateX(4px) translateY(-2px); }
}
@keyframes mk-dance {
  0%   { transform: rotate(-8deg) translateY(0px); }
  25%  { transform: rotate(8deg) translateY(-10px); }
  50%  { transform: rotate(-6deg) translateY(-4px); }
  75%  { transform: rotate(6deg) translateY(-12px); }
  100% { transform: rotate(-8deg) translateY(0px); }
}
@keyframes mk-goofy {
  0%   { transform: rotate(-12deg) scaleX(1) translateY(0); }
  20%  { transform: rotate(15deg) scaleX(1.1) translateY(-8px); }
  40%  { transform: rotate(-10deg) scaleX(0.9) translateY(-2px); }
  60%  { transform: rotate(18deg) scaleX(1.15) translateY(-10px); }
  80%  { transform: rotate(-8deg) scaleX(0.95) translateY(-3px); }
  100% { transform: rotate(-12deg) scaleX(1) translateY(0); }
}
@keyframes mk-walk {
  0%,100% { transform: translateY(0px); }
  50%     { transform: translateY(-4px); }
}
@keyframes mk-pant {
  0%,100% { transform: scale(1,1); }
  50%     { transform: scale(1.06,0.97); }
}
@keyframes mk-bounce {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(-12px); }
}
@keyframes mk-slam {
  0%   { transform: rotate(0deg) translateY(0); }
  30%  { transform: rotate(20deg) translateY(8px); }
  50%  { transform: rotate(20deg) translateY(8px); }
  70%  { transform: rotate(-5deg) translateY(-4px); }
  100% { transform: rotate(0deg) translateY(0); }
}
@keyframes mk-startle {
  0%   { transform: translateY(0) rotate(0); }
  25%  { transform: translateY(-15px) rotate(-10deg); }
  50%  { transform: translateY(-8px) rotate(8deg); }
  75%  { transform: translateY(-4px) rotate(-4deg); }
  100% { transform: translateY(0) rotate(0); }
}
@keyframes char-pop {
  0%   { transform: translateY(60px) scale(0.1); opacity:0; }
  60%  { transform: translateY(-10px) scale(1.12); opacity:1; }
  80%  { transform: translateY(3px) scale(0.96); opacity:1; }
  100% { transform: translateY(0) scale(1); opacity:1; }
}
@keyframes note-float {
  0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(-120px) rotate(30deg); opacity: 0; }
}
@keyframes big-pop {
  0%   { transform: scale(0); opacity: 0; }
  60%  { transform: scale(1.2); opacity: 1; }
  80%  { transform: scale(0.95); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes leg-near {
  0%,100% { transform: rotate(-20deg); }
  50%     { transform: rotate(20deg); }
}
@keyframes leg-far {
  0%,100% { transform: rotate(20deg); }
  50%     { transform: rotate(-20deg); }
}
@keyframes arm-near {
  0%,100% { transform: rotate(20deg); }
  50%     { transform: rotate(-20deg); }
}
@keyframes arm-far {
  0%,100% { transform: rotate(-20deg); }
  50%     { transform: rotate(20deg); }
}
</style>
</head>
<body>
<div id="container">
  <div id="start-screen">
    <h1>MEERKAT DANCE</h1>
    <p>A Pixar-Quality Animation</p>
    <button id="start-btn">CLICK TO START</button>
  </div>
  <div id="stage">
    <div class="bg active" id="bg-madagascar"></div>
    <div class="bg" id="bg-jungle"></div>
    <div class="bg" id="bg-desert"></div>
    <div class="bg" id="bg-mountains"></div>
    <div id="biome-decorations"></div>
    <svg id="main" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="rg-body" cx="35%" cy="28%" r="65%">
          <stop offset="0%" stop-color="#E8C882"/>
          <stop offset="50%" stop-color="#C8A060"/>
          <stop offset="100%" stop-color="#7A5028"/>
        </radialGradient>
        <radialGradient id="rg-head" cx="38%" cy="30%" r="62%">
          <stop offset="0%" stop-color="#EDD090"/>
          <stop offset="55%" stop-color="#C8A060"/>
          <stop offset="100%" stop-color="#7A5028"/>
        </radialGradient>
        <radialGradient id="rg-belly" cx="50%" cy="40%" r="55%">
          <stop offset="0%" stop-color="#FFF0C8"/>
          <stop offset="70%" stop-color="#E8D09A"/>
          <stop offset="100%" stop-color="#C8B070"/>
        </radialGradient>
        <radialGradient id="rg-iris" cx="35%" cy="32%" r="60%">
          <stop offset="0%" stop-color="#D49030"/>
          <stop offset="60%" stop-color="#8B5A10"/>
          <stop offset="100%" stop-color="#3A2000"/>
        </radialGradient>
        <radialGradient id="rg-rock" cx="35%" cy="28%" r="65%">
          <stop offset="0%" stop-color="#C0C0C0"/>
          <stop offset="55%" stop-color="#909090"/>
          <stop offset="100%" stop-color="#505050"/>
        </radialGradient>
        <radialGradient id="rg-lion" cx="35%" cy="30%" r="62%">
          <stop offset="0%" stop-color="#F0C060"/>
          <stop offset="60%" stop-color="#C89030"/>
          <stop offset="100%" stop-color="#7A5010"/>
        </radialGradient>
        <radialGradient id="rg-zebra" cx="35%" cy="30%" r="62%">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="60%" stop-color="#DDDDDD"/>
          <stop offset="100%" stop-color="#888888"/>
        </radialGradient>
        <radialGradient id="rg-giraffe" cx="35%" cy="30%" r="62%">
          <stop offset="0%" stop-color="#F0D080"/>
          <stop offset="60%" stop-color="#C8A040"/>
          <stop offset="100%" stop-color="#806020"/>
        </radialGradient>
        <radialGradient id="rg-hippo" cx="35%" cy="30%" r="62%">
          <stop offset="0%" stop-color="#A090C8"/>
          <stop offset="60%" stop-color="#7060A0"/>
          <stop offset="100%" stop-color="#403060"/>
        </radialGradient>
        <radialGradient id="sky-grad" cx="50%" cy="0%" r="100%">
          <stop offset="0%" stop-color="#5BC8F5"/>
          <stop offset="100%" stop-color="#87CEEB"/>
        </radialGradient>
      </defs>

      <!-- Sky and ground always visible -->
      <rect x="0" y="0" width="800" height="480" fill="url(#sky-grad)"/>
      <!-- Ground -->
      <rect id="ground-rect" x="0" y="390" width="800" height="90" fill="#8B7355"/>
      <rect x="0" y="390" width="800" height="8" fill="#A08B60"/>
      <!-- Sun -->
      <circle cx="700" cy="60" r="45" fill="#FFE060" opacity="0.9"/>
      <circle cx="700" cy="60" r="38" fill="#FFF080"/>
      <!-- Distant hills -->
      <ellipse cx="150" cy="420" rx="200" ry="60" fill="#6ab04c" opacity="0.5"/>
      <ellipse cx="650" cy="425" rx="180" ry="55" fill="#6ab04c" opacity="0.5"/>

      <g id="rocks-group" style="transition: transform 0.8s ease, opacity 0.8s ease;">
        <ellipse cx="170" cy="372" rx="60" ry="32" fill="url(#rg-rock)" stroke="#404040" stroke-width="1"/>
        <ellipse cx="155" cy="362" rx="18" ry="8" fill="rgba(255,255,255,0.15)"/>
        <ellipse cx="285" cy="368" rx="56" ry="29" fill="url(#rg-rock)" stroke="#404040" stroke-width="1"/>
        <ellipse cx="272" cy="359" rx="16" ry="7" fill="rgba(255,255,255,0.15)"/>
        <ellipse cx="400" cy="362" rx="68" ry="36" fill="url(#rg-rock)" stroke="#404040" stroke-width="1"/>
        <ellipse cx="382" cy="350" rx="22" ry="9" fill="rgba(255,255,255,0.15)"/>
        <ellipse cx="515" cy="368" rx="56" ry="29" fill="url(#rg-rock)" stroke="#404040" stroke-width="1"/>
        <ellipse cx="502" cy="359" rx="16" ry="7" fill="rgba(255,255,255,0.15)"/>
        <ellipse cx="630" cy="372" rx="60" ry="32" fill="url(#rg-rock)" stroke="#404040" stroke-width="1"/>
        <ellipse cx="616" cy="362" rx="18" ry="8" fill="rgba(255,255,255,0.15)"/>
      </g>

      <g id="mk-group"></g>
      <g id="walk-group" display="none"></g>
      <g id="mad-chars-group"></g>
    </svg>
    <div id="music-notes-layer"></div>
    <div id="finale-text"><span id="finale-span">EVERYBODY MOVE IT MOVE IT!</span></div>
  </div>
  <div id="end-screen">
    <h2>THE END</h2>
    <button id="watch-again">Watch Again</button>
  </div>
</div>

<script>
const GROUND_Y = 390;
const FEET_OFFSET = 47;
const STAND_Y = GROUND_Y - FEET_OFFSET; // 343

const MK_DATA = [
  { id:'mk1', cx:170, cy:322, c1:'#C8A86A', c2:'#8A6030', belly:'#E8D09A' },
  { id:'mk2', cx:285, cy:318, c1:'#BFA05C', c2:'#7A5825', belly:'#E0CA90' },
  { id:'mk3', cx:400, cy:310, c1:'#D4B578', c2:'#8A6038', belly:'#EDDA9C', isCenter:true },
  { id:'mk4', cx:515, cy:318, c1:'#B89650', c2:'#7A5420', belly:'#DBC880' },
  { id:'mk5', cx:630, cy:322, c1:'#C2A462', c2:'#806022', belly:'#E6CC90' },
];

let audioCtx = null;
let mkEls = {};
let animationRunning = false;
let musicStopFlag = false;
let noteInterval = null;

// ─── Audio ─────────────────────────────────────────────────────────────────
function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playTone(freq, type, dur, vol, startTime) {
  if (!audioCtx) return;
  const t = (startTime !== undefined) ? startTime : audioCtx.currentTime;
  const v = (vol !== undefined) ? vol : 0.3;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(v, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.05);
}

function playKick(t) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.setValueAtTime(150, t);
  osc.frequency.exponentialRampToValueAtTime(40, t+0.08);
  gain.gain.setValueAtTime(1.0, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t+0.15);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t+0.2);
}

function playSnare(t) {
  if (!audioCtx) return;
  const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate*0.1), audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.8;
  const src = audioCtx.createBufferSource();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass'; filter.frequency.value = 3000; filter.Q.value = 0.5;
  src.buffer = buf;
  gain.gain.setValueAtTime(0.5, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t+0.1);
  src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  src.start(t); src.stop(t+0.15);
}

function playHihat(t, vol) {
  if (!audioCtx) return;
  const v = (vol !== undefined) ? vol : 0.18;
  const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate*0.05), audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
  const src = audioCtx.createBufferSource();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'highpass'; filter.frequency.value = 8000;
  src.buffer = buf;
  gain.gain.setValueAtTime(v, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t+0.05);
  src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  src.start(t); src.stop(t+0.08);
}

function stopMusic() {
  musicStopFlag = true;
}

function startMusic() {
  if (!audioCtx) return;
  musicStopFlag = false;
  const BPM = 130;
  const beat = 60 / BPM;
  const eighth = beat / 2;
  const melody = [392, 392, 440, 392, 330, 294, 392, 392, 440, 392, 349, 330];
  const melodyDurs = [0.25,0.25,0.25,0.25,0.5,0.75, 0.25,0.25,0.25,0.25,0.5,0.75];
  const loopBars = 8;

  function scheduleLoop(startT) {
    if (musicStopFlag) return;
    const loopDur = loopBars * beat * 4;
    for(let bar=0; bar<loopBars; bar++) {
      for(let b=0; b<4; b++) {
        const t = startT + bar*beat*4 + b*beat;
        if(b===0||b===2) playKick(t);
        if(b===1||b===3) playSnare(t);
        playHihat(t, 0.18);
        playHihat(t+eighth, 0.12);
      }
    }
    for(let bar=0; bar<loopBars; bar++) {
      for(let b=0;b<4;b++) {
        const t = startT + bar*beat*4 + b*beat;
        playTone(98, 'sine', beat*0.8, 0.35, t);
      }
    }
    let mt = startT;
    const totalMelDur = melodyDurs.reduce((a,b)=>a+b,0)*beat;
    const melRep = Math.ceil((loopDur+2) / totalMelDur);
    for(let r=0;r<melRep;r++) {
      for(let i=0;i<melody.length;i++) {
        if(mt >= startT+loopDur) break;
        playTone(melody[i], 'triangle', melodyDurs[i]*beat*0.85, 0.18, mt);
        mt += melodyDurs[i]*beat;
      }
    }
    if(!musicStopFlag) {
      setTimeout(() => {
        if(!musicStopFlag) scheduleLoop(audioCtx.currentTime + 0.05);
      }, (loopDur - 0.2)*1000);
    }
  }
  scheduleLoop(audioCtx.currentTime + 0.1);
}

function playJumpSound() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  playTone(200, 'sine', 0.1, 0.4, t);
  playTone(400, 'sine', 0.1, 0.4, t+0.08);
  playTone(600, 'sine', 0.12, 0.35, t+0.16);
}

function playThud() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  playTone(80, 'sine', 0.15, 0.8, t);
  playTone(60, 'sine', 0.2, 0.6, t+0.03);
  const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate*0.08), audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.5;
  const src = audioCtx.createBufferSource();
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.5, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t+0.08);
  src.buffer = buf;
  src.connect(gain); gain.connect(audioCtx.destination);
  src.start(t); src.stop(t+0.1);
}

function playCrash() {
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  playTone(300, 'sawtooth', 0.05, 0.8, t);
  playTone(180, 'sawtooth', 0.08, 0.7, t+0.02);
  const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate*0.3), audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(audioCtx.sampleRate*0.15));
  const src = audioCtx.createBufferSource();
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(1.0, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t+0.3);
  src.buffer = buf;
  src.connect(gain); gain.connect(audioCtx.destination);
  src.start(t); src.stop(t+0.35);
}

function playSlam() {
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  playTone(120, 'sawtooth', 0.12, 1.0, t);
  playTone(80, 'sine', 0.2, 0.8, t+0.05);
}

// ─── Speech ────────────────────────────────────────────────────────────────
function say(text, opts) {
  return new Promise(function(resolve) {
    if(!window.speechSynthesis) { setTimeout(resolve, 1500); return; }
    window.speechSynthesis.cancel();
    const o = opts || {};
    const utt = new SpeechSynthesisUtterance(text);
    utt.rate = o.rate || 1.0;
    utt.pitch = o.pitch || 1.4;
    utt.volume = 1.0;
    const timeout = setTimeout(resolve, Math.max(2000, text.length*80));
    utt.onend = function() { clearTimeout(timeout); setTimeout(resolve, 200); };
    utt.onerror = function() { clearTimeout(timeout); resolve(); };
    window.speechSynthesis.speak(utt);
  });
}

// ─── Utilities ─────────────────────────────────────────────────────────────
function wait(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if(attrs) {
    for(const k in attrs) el.setAttribute(k, attrs[k]);
  }
  return el;
}

// ─── Eye Drawing ───────────────────────────────────────────────────────────
function drawEye(parent, x, y, r) {
  const radius = r || 6;
  const sclera = svgEl('ellipse', { cx:String(x), cy:String(y), rx:String(radius), ry:String(radius+0.5), fill:'white' });
  parent.appendChild(sclera);
  const iris = svgEl('circle', { cx:String(x), cy:String(y), r:String(radius*0.75), fill:'url(#rg-iris)' });
  parent.appendChild(iris);
  const pupil = svgEl('circle', { cx:String(x), cy:String(y), r:String(radius*0.42), fill:'#111' });
  parent.appendChild(pupil);
  const hl1 = svgEl('circle', { cx:String(x-radius*0.25), cy:String(y-radius*0.25), r:String(radius*0.2), fill:'white' });
  parent.appendChild(hl1);
  const hl2 = svgEl('circle', { cx:String(x+radius*0.3), cy:String(y+radius*0.17), r:String(radius*0.12), fill:'rgba(255,255,255,0.8)' });
  parent.appendChild(hl2);
}

function drawSpiralEye(parent, x, y) {
  parent.appendChild(svgEl('ellipse', { cx:String(x), cy:String(y), rx:'6', ry:'6.5', fill:'white' }));
  parent.appendChild(svgEl('path', { d:`M ${x},${y} Q ${x+3},${y-3} ${x+4},${y} Q ${x+3},${y+3} ${x},${y+4} Q ${x-3},${y+3} ${x-4},${y} Q ${x-3},${y-3} ${x},${y-4} Q ${x+1},${y-2} ${x},${y}`, stroke:'#333', 'stroke-width':'1.2', fill:'none' }));
  parent.appendChild(svgEl('circle', { cx:String(x), cy:String(y), r:'1', fill:'#333' }));
}

// ─── Meerkat Front View ─────────────────────────────────────────────────────
function drawMeerkatFront(mk, options) {
  const opts = options || {};
  const lounging = (opts.lounging !== false);
  const dancing = !!opts.dancing;
  const slamming = !!opts.slamming;
  const panting = !!opts.panting;
  const spiralEyes = !!opts.spiralEyes;

function setMkAnim(id, anim) {
  if(!mkEls[id]) return;
  mkEls[id].style.transformBox = 'fill-box';
  mkEls[id].style.transformOrigin = 'center';
  mkEls[id].style.animation = anim;
}

}

function replaceMeerkatStanding(mk, options) {
  const opts = options || {};
  const grp = document.getElementById('mk-group');
  if(mkEls[mk.id]) mkEls[mk.id].remove();
  const el = drawMeerkatFront(mk, Object.assign({ lounging:false }, opts));
  el.setAttribute('transform', `translate(${mk.cx},${STAND_Y})`);
  grp.appendChild(el);
  mkEls[mk.id] = el;
  return el;
}

// ─── Jump to Ground ──────────────────────────────────────────────────────────
function jumpToGround(id, staggerMs) {
  const delay = staggerMs || 0;
  return new Promise(function(resolve) {
    setTimeout(function() {
      const el = mkEls[id];
      if(!el) { resolve(); return; }
      const mk = MK_DATA.find(function(m) { return m.id===id; });
      playJumpSound();
      const origY = mk.cy;
      // Go up
      el.style.transition = 'transform 0.28s ease-out';
      el.setAttribute('transform', `translate(${mk.cx},${origY-80})`);
      setTimeout(function() {
        // Come down to ground
        el.style.transition = 'transform 0.32s cubic-bezier(0.55,0,1,0.45)';
        el.setAttribute('transform', `translate(${mk.cx},${STAND_Y})`);
        setTimeout(function() {
          playThud();
          cameraShake();
          replaceMeerkatStanding(mk, {});
          resolve();
        }, 340);
      }, 290);
    }, delay);
  });
}

// ─── Biome Walk ───────────────────────────────────────────────────────────────
async function doBiomeWalk() {
  setupWalkScene();
  const wg = document.getElementById('walk-group');
  const biomes = [
    { id:'jungle', bg:'bg-jungle' },
    { id:'desert', bg:'bg-desert' },
    { id:'mountains', bg:'bg-mountains' },
    { id:'desert', bg:'bg-desert' },
    { id:'jungle', bg:'bg-jungle' },
    { id:'madagascar', bg:'bg-madagascar' },
  ];

  // Keep characters visible on screen — just cycle biome backgrounds
  wg.style.transition = 'none';
  wg.setAttribute('transform', 'translate(0,0)');

  for(let b=0; b<biomes.length; b++) {
    const biome = biomes[b];
    document.querySelectorAll('.bg').forEach(function(el) { el.classList.remove('active'); });
    const bgEl = document.getElementById(biome.bg);
    if(bgEl) bgEl.classList.add('active');
    showBiomeDecorations(biome.id);
    await wait(1800);
  }

  document.querySelectorAll('.bg').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('bg-madagascar').classList.add('active');
  showBiomeDecorations('madagascar');
  await wait(300);
  teardownWalkScene();
  clearDecorations();
}

// ─── MAIN ANIMATION SEQUENCE ─────────────────────────────────────────────────
async function runAnimation() {
  // Step 1: Meerkats lounging
  initMeerkats(true);
  await wait(1500);

  // Step 2: Center meerkat bounces/looks annoyed
  setMkAnim('mk3', 'mk-bounce 1.2s ease-in-out 2');
  await wait(2800);
  setMkAnim('mk3', '');
  await wait(400);

  // Step 3: Slam + startle
  playSlam();
  cameraShake();
  setMkAnim('mk3', 'mk-slam 0.6s ease-in-out');
  await wait(100);
  ['mk1','mk2','mk4','mk5'].forEach(function(id) {
    const mk = MK_DATA.find(function(m) { return m.id===id; });
    const grp = document.getElementById('mk-group');
    if(mkEls[id]) mkEls[id].remove();
    const el = drawMeerkatFront(mk, { lounging:true, spiralEyes:true });
    grp.appendChild(el);
    mkEls[id] = el;
    el.style.animation = 'mk-startle 0.5s ease-in-out';
  });
  await wait(700);
  setMkAnim('mk3', '');

  // Step 4: Speech
  await say("I need... I just... I can't take this anymore!!", {pitch:1.4, rate:1.0});
  await say("Huh? What?!", {pitch:1.3, rate:1.1});

  // Step 5
  await say("I need to... move it.", {pitch:1.4, rate:0.95});
  await say("What?! Did he just say...?", {pitch:1.35, rate:1.0});

  // Step 6: Bounce and shout
  setMkAnim('mk3', 'mk-bounce 0.3s ease-in-out infinite');
  await say("I NEED TO MOVE IT! MOVE IT!", {pitch:1.5, rate:1.15});
  setMkAnim('mk3', '');

  // Step 7: 5-second silence
  await wait(5000);

  // Step 8: Rocks slide down, music, center dances solo
  hideRocks();
  await wait(900);
  startMusic();
  const centerMk = MK_DATA.find(function(m) { return m.isCenter; });
  replaceMeerkatStanding(centerMk, { dancing:true });
  mkEls['mk3'].style.animation = 'mk-dance 0.5s ease-in-out infinite';
  await wait(3000);

  // Step 9: 3-second pause - others stare
  await wait(3000);

  // Step 10: All 5 jump to ground
  const jumpPromises = MK_DATA.map(function(mk, i) { return jumpToGround(mk.id, i*80); });
  await Promise.all(jumpPromises);
  await wait(500);
  setAllMkAnim('mk-goofy 0.5s ease-in-out infinite');
  await wait(3000);

  // Step 11: Side-profile walking through biomes
  stopMusic();
  setAllMkAnim('');
  await doBiomeWalk();

  // Back - all panting
  MK_DATA.forEach(function(mk) {
    replaceMeerkatStanding(mk, { panting:true });
    mkEls[mk.id].style.animation = 'mk-pant 0.6s ease-in-out infinite';
  });
  await wait(800);

  // Step 12: "Okay... I'm ready to snooze it now..."
  setAllMkAnim('');
  await say("Okay... I'm ready to snooze it now...", {pitch:1.4, rate:0.9});

  // Step 13: Rocks reappear, meerkats lounge
  showRocks();
  await wait(900);
  initMeerkats(true);
  setAllMkAnim('mk-startle 0.4s ease-in-out');
  await wait(600);
  setAllMkAnim('');

  // Step 14: 2-second pause
  await wait(2000);

  // Step 15: Madagascar characters burst out
  playCrash();
  cameraShake();
  spawnMadChars();
  await wait(600);
  await say("We heard you guys like to MOVE IT!", {pitch:1.2, rate:1.1});
  await say("Can we move it... move it... WITH you?", {pitch:1.2, rate:1.0});

  // Step 16: 3-second pause
  await wait(3000);

  // Step 17: Music restarts, rocks away, everyone dances
  hideRocks();
  await wait(800);
  const jumpPromises2 = MK_DATA.map(function(mk, i) { return jumpToGround(mk.id, i*60); });
  await Promise.all(jumpPromises2);
  await wait(300);
  startMusic();
  setupFinaleDance();
  await say("EVERYBODY MOVE IT MOVE IT!", {pitch:1.5, rate:1.2});
  await wait(6000);

  // Step 18: THE END
  stopMusic();
  stopNoteRain();
  await wait(500);
  hideFinaleText();
  document.getElementById('end-screen').style.display = 'flex';
}

// ─── Startup ──────────────────────────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', function() {
  if(animationRunning) return;
  animationRunning = true;
  initAudio();
  document.getElementById('start-screen').style.display = 'none';
  runAnimation();
});

document.getElementById('watch-again').addEventListener('click', function() {
  animationRunning = false;
  stopMusic();
  stopNoteRain();
  hideFinaleText();
  clearMadChars();
  document.getElementById('end-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'flex';
  showRocks();
  document.getElementById('mk-group').innerHTML = '';
  mkEls = {};
  document.querySelectorAll('.bg').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('bg-madagascar').classList.add('active');
  clearDecorations();
  document.getElementById('walk-group').innerHTML = '';
  document.getElementById('walk-group').setAttribute('display','none');
  document.getElementById('mk-group').setAttribute('display','');
  document.getElementById('mk-group').removeAttribute('display');
});
</script>
</body>
