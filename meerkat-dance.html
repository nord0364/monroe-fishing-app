<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meerkat Dance!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: #000;
  font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
  display: flex; align-items: center; justify-content: center;
}

#stage {
  width: 800px; height: 480px;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}

/* ── BACKGROUNDS ── */
.bg {
  position: absolute; inset: 0;
  opacity: 0;
  transition: opacity 1.2s ease;
}
.bg.active { opacity: 1; }

#bg-madagascar {
  background: linear-gradient(180deg,
    #5BB8E0 0%, #9ED4F5 40%,
    #D4C468 40%, #C2AA44 50%,
    #6AA040 50%, #4A8030 100%);
}
#bg-madagascar::before {
  content: '';
  position: absolute;
  width: 90px; height: 90px;
  background: radial-gradient(circle at 40% 35%, #FFF59D, #FFD600 50%, #FFB300);
  border-radius: 50%;
  top: 6%; right: 16%;
  box-shadow: 0 0 60px #FFD70060;
}
#bg-madagascar::after {
  content: '';
  position: absolute;
  width: 160px; height: 36px;
  background: radial-gradient(ellipse, #fff 0%, #e8f4ff 60%, transparent 100%);
  border-radius: 50%;
  top: 12%; left: 10%;
  box-shadow: 80px -10px 0 20px #ffffffaa, 160px 5px 0 10px #ffffffcc;
}

#bg-jungle {
  background: linear-gradient(180deg,
    #1A4A1A 0%, #2A6A2A 30%,
    #1E5020 30%, #163A10 70%,
    #3A6020 70%, #2A4A10 100%);
}
#bg-desert {
  background: linear-gradient(180deg,
    #87CEEB 0%, #C9E8F5 35%,
    #E8C86A 35%, #D4A840 60%,
    #C09030 60%, #A07020 100%);
}
#bg-mountains {
  background: linear-gradient(180deg,
    #4A6AA0 0%, #7A9AC8 40%,
    #8090A0 40%, #607080 65%,
    #809060 65%, #607040 100%);
}

/* Ground always on top */
#ground-rect {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 90px;
  background: linear-gradient(180deg, #8B6914 0%, #6B4E0A 30%, #5A3E08 100%);
  border-top: 3px solid #A0782A;
  z-index: 5;
}

#svg-stage {
  position: absolute;
  inset: 0;
  z-index: 10;
}

/* ── ROCKS GROUP ── */
#rocks-group {
  transition: transform 0.7s cubic-bezier(.4,0,.2,1), opacity 0.7s ease;
}
#rocks-group.hidden {
  transform: translateY(100px);
  opacity: 0;
}

/* ── SHAKE ── */
@keyframes shake {
  0%,100% { transform: translate(0,0); }
  10% { transform: translate(-8px, -5px); }
  20% { transform: translate(8px, 5px); }
  30% { transform: translate(-6px, 4px); }
  40% { transform: translate(6px, -4px); }
  50% { transform: translate(-4px, 3px); }
  60% { transform: translate(4px, -3px); }
  70% { transform: translate(-3px, 2px); }
  80% { transform: translate(3px, -2px); }
  90% { transform: translate(-2px, 1px); }
}
.shake { animation: shake 0.5s ease; }

/* ── MEERKAT ANIMATIONS ── */
@keyframes mk-dance {
  0%   { transform: rotate(-15deg) translateY(0px); }
  15%  { transform: rotate(15deg) translateY(-12px); }
  30%  { transform: rotate(-10deg) translateY(0px); }
  45%  { transform: rotate(12deg) translateY(-10px); }
  60%  { transform: rotate(-8deg) translateY(0px); }
  75%  { transform: rotate(10deg) translateY(-8px); }
  100% { transform: rotate(-15deg) translateY(0px); }
}

@keyframes mk-goofy {
  0%   { transform: rotate(-20deg) scaleX(0.85) translateY(0); }
  12%  { transform: rotate(20deg) scaleX(1.15) translateY(-14px); }
  25%  { transform: rotate(-15deg) scaleX(0.9) translateY(0); }
  37%  { transform: rotate(18deg) scaleX(1.1) translateY(-12px); }
  50%  { transform: rotate(-12deg) scaleX(0.88) translateY(0); }
  62%  { transform: rotate(16deg) scaleX(1.08) translateY(-10px); }
  75%  { transform: rotate(-10deg) scaleX(0.92) translateY(0); }
  88%  { transform: rotate(14deg) scaleX(1.06) translateY(-8px); }
  100% { transform: rotate(-20deg) scaleX(0.85) translateY(0); }
}

@keyframes mk-walk {
  0%,100% { transform: translateY(0px); }
  50%      { transform: translateY(-5px); }
}

@keyframes leg-swing-near {
  0%,100% { transform: rotate(20deg); }
  50%      { transform: rotate(-20deg); }
}
@keyframes leg-swing-far {
  0%,100% { transform: rotate(-20deg); }
  50%      { transform: rotate(20deg); }
}
@keyframes arm-swing-near {
  0%,100% { transform: rotate(25deg); }
  50%      { transform: rotate(-25deg); }
}
@keyframes arm-swing-far {
  0%,100% { transform: rotate(-25deg); }
  50%      { transform: rotate(25deg); }
}

@keyframes mk-pant {
  0%,100% { transform: scale(1,1); }
  50%      { transform: scale(1.04,0.97); }
}
@keyframes mk-bounce {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-14px); }
}
@keyframes mk-slam {
  0%   { transform: translateY(0) rotate(0deg); }
  30%  { transform: translateY(-8px) rotate(-5deg); }
  55%  { transform: translateY(8px) rotate(3deg); }
  75%  { transform: translateY(-4px) rotate(-2deg); }
  100% { transform: translateY(0) rotate(0deg); }
}
@keyframes mk-startle {
  0%,100% { transform: translateY(0) rotate(0deg); }
  20% { transform: translateY(-20px) rotate(-8deg); }
  40% { transform: translateY(-18px) rotate(8deg); }
  60% { transform: translateY(-10px) rotate(-4deg); }
  80% { transform: translateY(-5px) rotate(4deg); }
}
@keyframes char-pop {
  0%   { transform: scale(0) translateY(60px); opacity:0; }
  70%  { transform: scale(1.15) translateY(-8px); opacity:1; }
  100% { transform: scale(1) translateY(0); opacity:1; }
}
@keyframes note-float {
  0%   { transform: translateY(0) rotate(-10deg); opacity:1; }
  100% { transform: translateY(-120px) rotate(20deg); opacity:0; }
}
@keyframes big-pop {
  0%   { transform: scale(0); opacity:0; }
  60%  { transform: scale(1.2); opacity:1; }
  80%  { transform: scale(0.95); }
  100% { transform: scale(1); opacity:1; }
}
@keyframes lounge-sway {
  0%,100% { transform: rotate(-3deg); }
  50%      { transform: rotate(3deg); }
}
@keyframes blink-close {
  0%,90%,100% { transform: scaleY(1); }
  95% { transform: scaleY(0.05); }
}
@keyframes mk-look-around {
  0%,100% { transform: translateX(0); }
  30% { transform: translateX(-6px); }
  70% { transform: translateX(6px); }
}

/* ── BIOME DECORATIONS ── */
.biome-deco {
  position: absolute;
  bottom: 90px;
  pointer-events: none;
}

/* ── MUSIC NOTES ── */
.music-note {
  position: absolute;
  font-size: 28px;
  color: #FFD700;
  text-shadow: 0 0 8px #FF8C00;
  pointer-events: none;
  animation: note-float 2s ease-out forwards;
  z-index: 50;
}

/* ── FINALE TEXT ── */
#finale-text {
  position: absolute;
  left: 50%; top: 30%;
  transform: translate(-50%,-50%) scale(0);
  font-size: 52px;
  font-weight: 900;
  color: #FFD700;
  text-shadow: 3px 3px 0 #FF4500, 6px 6px 10px #000, 0 0 30px #FFD700;
  letter-spacing: 3px;
  text-align: center;
  z-index: 60;
  white-space: nowrap;
  display: none;
}
#finale-text.visible {
  display: block;
  animation: big-pop 0.8s cubic-bezier(.34,1.56,.64,1) forwards;
}

/* ── THE END ── */
#the-end {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
#the-end.visible { display: flex; }
#the-end h1 {
  font-size: 80px;
  color: #FFD700;
  text-shadow: 4px 4px 0 #FF4500, 0 0 40px #FFD700;
  margin-bottom: 30px;
  animation: big-pop 1s cubic-bezier(.34,1.56,.64,1) forwards;
}
#watch-again {
  padding: 16px 40px;
  font-size: 26px;
  background: linear-gradient(135deg, #FFD700, #FF8C00);
  border: none; border-radius: 40px;
  color: #fff; font-family: inherit;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 4px 20px #FF450080;
  transform: scale(0);
  animation: char-pop 0.6s 0.8s cubic-bezier(.34,1.56,.64,1) forwards;
}
#watch-again:hover { transform: scale(1.08); }

/* ── START SCREEN ── */
#start-screen {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, #1A3A5A, #000814);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 200;
  cursor: pointer;
}
#start-screen h1 {
  font-size: 52px;
  color: #FFD700;
  text-shadow: 3px 3px 0 #FF4500, 0 0 30px #FFD700aa;
  margin-bottom: 16px;
  text-align: center;
}
#start-screen p {
  font-size: 22px;
  color: #fff;
  text-shadow: 0 2px 6px #000;
  margin-bottom: 40px;
}
#start-btn {
  padding: 18px 50px;
  font-size: 30px;
  background: linear-gradient(135deg, #FFD700, #FF8C00);
  border: none; border-radius: 50px;
  color: #fff; font-family: inherit; font-weight: 900;
  cursor: pointer;
  box-shadow: 0 6px 25px #FF450080;
  animation: mk-bounce 1.5s infinite;
}
</style>
</head>
<body>

</div>

<script>
// ─────────────────────────────────────────────
//  CONSTANTS
// ─────────────────────────────────────────────
const GROUND_Y    = 390;
const FEET_OFFSET = 47;
const STAND_Y     = GROUND_Y - FEET_OFFSET; // 343

const MK_DATA = [
  { id:'mk1', cx:170, cy:322, grad:'rg-body',  belly:'#E8D09A', isCenter:false },
  { id:'mk2', cx:285, cy:318, grad:'rg-body2', belly:'#E0CA90', isCenter:false },
  { id:'mk3', cx:400, cy:310, grad:'rg-body3', belly:'#EDDA9C', isCenter:true  },
  { id:'mk4', cx:515, cy:318, grad:'rg-body4', belly:'#DBC880', isCenter:false },

// ─────────────────────────────────────────────
//  UTILITY: sleep
// ─────────────────────────────────────────────
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ─────────────────────────────────────────────
//  UTILITY: say (SpeechSynthesis)
// ─────────────────────────────────────────────
function say(text, opts={}) {
  return new Promise(resolve => {
    if (!window.speechSynthesis) { resolve(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.rate  = opts.rate  ?? 1.0;
    u.pitch = opts.pitch ?? 1.4;
    u.volume = 1;
    // Pick a fun voice if available
    const voices = speechSynthesis.getVoices();
    if (voices.length) {
      const pref = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('uk'))
                || voices.find(v => v.lang.startsWith('en'))
                || voices[0];
      u.voice = pref;
    }
    u.onend = () => resolve();
    u.onerror = () => resolve();
    speechSynthesis.speak(u);
    // Safety timeout (5s per word + 3s base)
    setTimeout(resolve, Math.max(3000, text.split(' ').length * 500 + 1500));
  });
}

function sayAll(speeches) {
  // speeches: [{text, opts}]
  return speeches.reduce((p, s) => p.then(() => say(s.text, s.opts||{})), Promise.resolve());
}

// ─────────────────────────────────────────────
//  AUDIO: Web Audio API
// ─────────────────────────────────────────────
let musicNodes = [];
let musicPlaying = false;

function stopMusic() {
  musicPlaying = false;
  musicNodes.forEach(n => { try { n.stop(); } catch(e){} });
  musicNodes = [];
}

function playJumpSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g   = audioCtx.createGain();
  osc.connect(g); g.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(200, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.2);
  g.gain.setValueAtTime(0.3, audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.25);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + 0.3);
}

function playThudSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g   = audioCtx.createGain();
  osc.connect(g); g.connect(audioCtx.destination);
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(180, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.18);
  g.gain.setValueAtTime(0.5, audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + 0.25);
}

function playSlamSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g   = audioCtx.createGain();
  osc.connect(g); g.connect(audioCtx.destination);
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(300, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.1);
  g.gain.setValueAtTime(0.6, audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + 0.2);
}

function playCrashSound() {
  if (!audioCtx) return;
  // white noise burst
  const bufSize = audioCtx.sampleRate * 0.4;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random()*2-1);
  const src = audioCtx.createBufferSource();
  const g   = audioCtx.createGain();
  src.buffer = buf;
  src.connect(g); g.connect(audioCtx.destination);
  g.gain.setValueAtTime(0.7, audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
  src.start(audioCtx.currentTime);
  musicNodes.push(src);
}

function startMusic() {
  if (!audioCtx || musicPlaying) return;
  musicPlaying = true;
  const BPM = 130;
  const beat = 60 / BPM;       // seconds per beat
  const bar  = beat * 4;
  const eighth = beat / 2;

  // "I Like to Move It" melody approximation
  // G4=392, A4=440, E4=330, D4=294, C4=262, B3=247
  const melodyNotes = [
    [392,0],[392,eighth*0.5],[440,eighth],[392,eighth*2],[330,eighth*3],[294,eighth*4],
    [392,beat*2],[392,beat*2+eighth*0.5],[440,beat*2+eighth],[392,beat*2+eighth*2],
    [330,beat*2+eighth*3],[294,beat*2+eighth*4],
    [392,beat*4],[440,beat*4+eighth],[392,beat*4+eighth*2],[330,beat*4+beat],
    [262,beat*5+eighth],[294,beat*5+eighth*2],[262,beat*6],[262,beat*6+eighth*0.5],
    [294,beat*6+eighth],[262,beat*6+eighth*2],[247,beat*6+eighth*3],
    [262,beat*7],[392,beat*7+beat*0.5],
  ];
  const loopLen = bar * 3.5;

  function scheduleMusic(startTime) {
    if (!musicPlaying) return;
    const totalBars = Math.ceil(loopLen / bar);

    for (let i = 0; i < totalBars * 4; i++) {
      const t = startTime + i * beat;
      if (t - audioCtx.currentTime > loopLen + 1) break;

      // Kick on 1 & 3
      if (i % 4 === 0 || i % 4 === 2) {
        const k = audioCtx.createOscillator();
        const kg = audioCtx.createGain();
        k.connect(kg); kg.connect(audioCtx.destination);
        k.type = 'sine';
        k.frequency.setValueAtTime(180, t);
        k.frequency.exponentialRampToValueAtTime(50, t + 0.08);
        kg.gain.setValueAtTime(0.6, t);
        kg.gain.linearRampToValueAtTime(0, t + 0.1);
        k.start(t); k.stop(t + 0.15);
        musicNodes.push(k);
      }
      // Snare on 2 & 4
      if (i % 4 === 1 || i % 4 === 3) {
        const bufSize = Math.floor(audioCtx.sampleRate * 0.12);
        const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let j = 0; j < bufSize; j++) d[j] = (Math.random()*2-1) * (1 - j/bufSize);
        const sn = audioCtx.createBufferSource();
        const sg = audioCtx.createGain();
        sn.buffer = buf; sn.connect(sg); sg.connect(audioCtx.destination);
        sg.gain.setValueAtTime(0.35, t);
        sg.gain.linearRampToValueAtTime(0, t + 0.12);
        sn.start(t);
        musicNodes.push(sn);
      }
    }

    // Hihat every eighth
    const numEighths = Math.floor(loopLen / eighth);
    for (let i = 0; i < numEighths; i++) {
      const t = startTime + i * eighth;
      const bufSize = Math.floor(audioCtx.sampleRate * 0.06);
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let j = 0; j < bufSize; j++) d[j] = (Math.random()*2-1) * (1 - j/bufSize);
      const hh = audioCtx.createBufferSource();
      const hg = audioCtx.createGain();
      const hf = audioCtx.createBiquadFilter();
      hh.buffer = buf; hh.connect(hf); hf.connect(hg); hg.connect(audioCtx.destination);
      hf.type = 'highpass'; hf.frequency.value = 8000;
      hg.gain.setValueAtTime(0.15, t);
      hg.gain.linearRampToValueAtTime(0, t + 0.06);
      hh.start(t);
      musicNodes.push(hh);
    }

    // Melody (triangle oscillators)
    melodyNotes.forEach(([freq, offset]) => {
      const t = startTime + offset;
      if (t < audioCtx.currentTime - 0.05) return;
      const osc = audioCtx.createOscillator();
      const og  = audioCtx.createGain();
      osc.connect(og); og.connect(audioCtx.destination);
      osc.type = 'triangle';
      osc.frequency.value = freq;
      og.gain.setValueAtTime(0, t);
      og.gain.linearRampToValueAtTime(0.22, t + 0.02);
      og.gain.linearRampToValueAtTime(0.18, t + 0.1);
      og.gain.linearRampToValueAtTime(0, t + 0.22);
      osc.start(t); osc.stop(t + 0.25);
      musicNodes.push(osc);
    });

    // Bass (G2=98 on every beat)
    for (let i = 0; i < Math.floor(loopLen / beat); i++) {
      const t = startTime + i * beat;
      const b = audioCtx.createOscillator();
      const bg = audioCtx.createGain();
      b.connect(bg); bg.connect(audioCtx.destination);
      b.type = 'sine';
      b.frequency.value = 98;
      bg.gain.setValueAtTime(0, t);
      bg.gain.linearRampToValueAtTime(0.3, t + 0.02);
      bg.gain.linearRampToValueAtTime(0.2, t + 0.1);
      bg.gain.linearRampToValueAtTime(0, t + beat * 0.8);
      b.start(t); b.stop(t + beat);
      musicNodes.push(b);
    }

    // Schedule next loop
    if (musicPlaying) {
      setTimeout(() => scheduleMusic(startTime + loopLen), (loopLen - 0.5) * 1000);
    }
  }

  scheduleMusic(audioCtx.currentTime + 0.05);
}

function svgEl(tag, attrs={}) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}
function svgG(attrs={}) { return svgEl('g', attrs); }

// Draw Pixar-quality eye (centered at 0,0)
function mkEye(opts={}) {
  const g = svgEl('g');
  // Sclera (white)
  const sclera = svgEl('ellipse', { cx:'0', cy:'0', rx:'7', ry:'7.5', fill:'#FFFFFF' });
  g.appendChild(sclera);

  if (opts.spiral) {
    // Spiral/dizzy eyes
    const spiral = svgEl('circle', { cx:'0', cy:'0', r:'7', fill:'url(#rg-spiral)' });
    const sp1 = svgEl('path', {
      d:'M 0,0 Q 4,-4 4,0 Q 4,4 0,4 Q -4,4 -4,0 Q -4,-4 0,-4',
      fill:'none', stroke:'#888', 'stroke-width':'1.5'
    });
    g.appendChild(spiral); g.appendChild(sp1);
    return g;
  }

  // Iris
  const iris = svgEl('ellipse', { cx:'0', cy:'0', rx:'5', ry:'5.5', fill:'url(#rg-iris)' });
  g.appendChild(iris);

  // Pupil
  const pupil = svgEl('ellipse', { cx:'0', cy:'0', rx:'2.8', ry:'3', fill:'#0A0500' });
  g.appendChild(pupil);

  // Two specular highlights
  const spec1 = svgEl('ellipse', { cx:'-1.5', cy:'-1.8', rx:'1.5', ry:'1.5', fill:'#FFFFFF', opacity:'0.95' });
  const spec2 = svgEl('ellipse', { cx:'1.8',  cy:'-0.5', rx:'0.7', ry:'0.7', fill:'#FFFFFF', opacity:'0.8' });
  g.appendChild(spec1); g.appendChild(spec2);

  // Eyelid (closed for blink)
  if (opts.blink) {
    const lid = svgEl('ellipse', {
      cx:'0', cy:'-1', rx:'7', ry:'6',
      fill:`url(#rg-head)`,
      id:`lid-${Math.random().toString(36).slice(2,8)}`
    });
    g.appendChild(lid);
  }

  return g;
}

// ─────────────────────────────────────────────
//  SET ANIMATION on an element
// ─────────────────────────────────────────────
function setAnim(id, animCss) {
  const el = mkEls[id] || document.getElementById(id);
  if (!el) return;
  el.style.animation = animCss;
  el.style.transformOrigin = '50% 80%';
}

function clearAnim(id) {
  const el = mkEls[id] || document.getElementById(id);
  if (el) { el.style.animation = ''; el.style.transformOrigin = ''; }
}

function setAllAnim(animCss) {
  MK_DATA.forEach(mk => setAnim(mk.id, animCss));
}
function clearAllAnim() {
  MK_DATA.forEach(mk => clearAnim(mk.id));
}

// ─────────────────────────────────────────────
//  JUMP TO GROUND
// ─────────────────────────────────────────────
function jumpToGround(mkId, staggerMs) {
  return new Promise(resolve => {
    setTimeout(() => {
      const el = document.getElementById(mkId);
      const mk = MK_DATA.find(m => m.id === mkId);
      playJumpSound();

      // Set position to starting cy, then jump up
      el.style.transition = `transform 280ms cubic-bezier(.4,0,.6,1)`;
      el.style.transform = `translate(${mk.cx}px,${mk.cy - 80}px)`;

      setTimeout(() => {
        el.style.transition = `transform 320ms cubic-bezier(.4,0,1,1)`;
        el.style.transform = `translate(${mk.cx}px,${STAND_Y}px)`;

        setTimeout(() => {
          playThudSound();
          el.style.transition = '';
          // Replace with standing version, reposition
          replaceWithStanding(mkId, {});
          // Move the group element
          el.setAttribute('transform', `translate(${mk.cx},${STAND_Y})`);
          el.style.transform = '';
          resolve();
        }, 340);
      }, 290);
    }, staggerMs);
  });
}

  const s = document.getElementById('stage');

  setTimeout(() => s.classList.remove('shake'), 600);

// ─────────────────────────────────────────────
//  MUSIC NOTES RAIN
// ─────────────────────────────────────────────
let noteInterval = null;
function startNoteRain() {
  const notes = ['♩','♪','♫','♬','🎵'];
  const colors = ['#FFD700','#FF8C00','#FF4500','#FF69B4','#00BFFF'];
  noteInterval = setInterval(() => {
    const stage = document.getElementById('stage');
    const n = document.createElement('div');
    n.className = 'music-note';
    n.textContent = notes[Math.floor(Math.random()*notes.length)];
    n.style.color = colors[Math.floor(Math.random()*colors.length)];
    n.style.left  = Math.random()*740 + 20 + 'px';
    n.style.top   = Math.random()*200 + 50 + 'px';
    n.style.animationDuration = (1.2 + Math.random()) + 's';
    stage.appendChild(n);
    setTimeout(() => n.remove(), 2500);
  }, 250);
}
function stopNoteRain() {
  if (noteInterval) { clearInterval(noteInterval); noteInterval = null; }
}

// ─────────────────────────────────────────────
//  SET BIOME
// ─────────────────────────────────────────────
function setBiome(name) {
  document.querySelectorAll('.bg').forEach(b => b.classList.remove('active'));
  const bg = document.getElementById(`bg-${name}`);
  if (bg) bg.classList.add('active');

  // Show/hide biome decorations
  ['jungle','desert','mountains'].forEach(b => {
    const d = document.getElementById(`deco-${b}`);
    if (d) d.setAttribute('display', b === name ? 'block' : 'none');
  });
}

    const drawn = drawMeerkatProfile(profileGrads[i]);
    // Walking animation on sub-elements
    drawn.style.animation = 'mk-walk 0.4s ease-in-out infinite';
    drawn.style.transformOrigin = '0 10px';
    // Animate legs
    const farLeg = drawn.querySelector('#far-leg');
    const nearLeg = drawn.querySelector('#near-leg');
    const farArm  = drawn.querySelector('#far-arm');
    const nearArm = drawn.querySelector('#near-arm');
    if (farLeg)  { farLeg.style.animation  = 'leg-swing-far 0.4s ease-in-out infinite';  farLeg.style.transformOrigin  = '0px 28px'; }
    if (nearLeg) { nearLeg.style.animation = 'leg-swing-near 0.4s ease-in-out infinite'; nearLeg.style.transformOrigin = '0px 28px'; }
    if (farArm)  { farArm.style.animation  = 'arm-swing-far 0.4s ease-in-out infinite';  farArm.style.transformOrigin  = '0px 14px'; }
    if (nearArm) { nearArm.style.animation = 'arm-swing-near 0.4s ease-in-out infinite'; nearArm.style.transformOrigin = '0px 12px'; }

    pg.appendChild(drawn);
    walkG.appendChild(pg);
    profileMks.push(pg);
  });

  const biomes = ['jungle','desert','mountains','desert','jungle','madagascar'];
  const biomeNames = ['Jungle','Desert','Mountains','Desert','Jungle','Madagascar'];

  for (let b = 0; b < biomes.length; b++) {
    setBiome(biomes[b]);
    // Animate walking across screen
    await new Promise(resolve => {
      const duration = 2200;
      const startTime = performance.now();
      const baseXs = startXs.map(x => x);
      const targetXs = startXs.map(x => x + 700);

      function frame(now) {
        const elapsed = now - startTime;
        const t = Math.min(elapsed / duration, 1);
        profileMks.forEach((pg, i) => {
          const cx = baseXs[i] + (targetXs[i] - baseXs[i]) * t;
          pg.setAttribute('transform', `translate(${cx},${STAND_Y})`);
        });
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          // Reset positions for next biome (wrap around)
          profileMks.forEach((pg, i) => {
            pg.setAttribute('transform', `translate(${baseXs[i]},${STAND_Y})`);
          });
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  // Clean up
  walkG.setAttribute('display','none');
  walkG.innerHTML = '';
}

// ─────────────────────────────────────────────
//  FINALE TEXT SHOW/HIDE
// ─────────────────────────────────────────────
function showFinaleText(text) {
  const ft = document.getElementById('finale-text');
  ft.textContent = text;
  ft.setAttribute('display','block');
  ft.style.animation = '';
  void ft.getBoundingClientRect();
  ft.style.animation = 'big-pop 0.8s cubic-bezier(.34,1.56,.64,1) forwards';
}
function hideFinaleText() {
  const ft = document.getElementById('finale-text');
  ft.setAttribute('display','none');
  ft.style.animation = '';
}

// ─────────────────────────────────────────────
//  MAKE MEERKAT LOOK UP (swap eyes to look-up)
// ─────────────────────────────────────────────
function mkLookUp(id) {
  replaceWithStanding(id, { lounge: false });
  const el = document.getElementById(id);
  el.style.animation = 'lounge-sway 2s ease-in-out infinite';
}

// ─────────────────────────────────────────────
//  SET SPIRAL EYES on a meerkat
// ─────────────────────────────────────────────
function setSpiralEyes(id) {
  const mk = MK_DATA.find(m => m.id === id);
  const el = document.getElementById(id);
  el.innerHTML = '';
  const drawn = drawMeerkat(mk.grad, mk.belly, { lounge: true, spiral: true });
  el.appendChild(drawn);
}

// ─────────────────────────────────────────────
//  DANCE CHARACTERS
// ─────────────────────────────────────────────
function danceAll() {
  const anims = ['mk-dance 0.5s ease-in-out infinite','mk-goofy 0.6s ease-in-out infinite',
                 'mk-bounce 0.45s ease-in-out infinite','mk-dance 0.55s ease-in-out infinite 0.1s',
                 'mk-goofy 0.65s ease-in-out infinite 0.2s'];
  MK_DATA.forEach((mk,i) => setAnim(mk.id, anims[i]));
}

function danceFinaleAll() {
  const anims = ['mk-goofy 0.4s ease-in-out infinite','mk-dance 0.45s ease-in-out infinite 0.05s',
                 'mk-bounce 0.38s ease-in-out infinite 0.1s','mk-goofy 0.42s ease-in-out infinite 0.15s',
                 'mk-dance 0.46s ease-in-out infinite 0.08s'];
  MK_DATA.forEach((mk,i) => setAnim(mk.id, anims[i]));
  ['ch-alex','ch-marty','ch-melman','ch-gloria'].forEach((id,i) => {
    const el = document.getElementById(id);
    if (el) {
      el.style.animation = ['mk-goofy 0.5s ease-in-out infinite',
                            'mk-dance 0.48s ease-in-out infinite 0.1s',
                            'mk-bounce 0.55s ease-in-out infinite 0.05s',
                            'mk-goofy 0.52s ease-in-out infinite 0.12s'][i] || '';
      el.style.transformOrigin = '50% 80%';
    }
  });
}

// ─────────────────────────────────────────────
//  JUMP BACK TO ROCKS (end of walk)
// ─────────────────────────────────────────────
async function jumpBackToRocks() {
  // All jump back to their lounge positions
  const promises = MK_DATA.map((mk, i) => new Promise(resolve => {
    setTimeout(() => {
      const el = document.getElementById(mk.id);
      playJumpSound();
      el.style.transition = 'transform 280ms cubic-bezier(.4,0,.6,1)';
      el.style.transform = `translate(${mk.cx}px,${mk.cy - 80}px)`;
      setTimeout(() => {
        el.style.transition = 'transform 320ms cubic-bezier(.4,0,1,1)';
        el.style.transform = `translate(${mk.cx}px,${mk.cy}px)`;
        setTimeout(() => {
          playThudSound();
          el.style.transition = '';
          el.style.transform = '';
          replaceWithLounge(mk.id);
          el.setAttribute('transform', `translate(${mk.cx},${mk.cy})`);
          resolve();
        }, 340);
      }, 290);
    }, i * 120);
  }));
  await Promise.all(promises);
}

// ─────────────────────────────────────────────
//  RESET POSITIONS for meerkats
// ─────────────────────────────────────────────
function resetMkPositions() {
  MK_DATA.forEach(mk => {
    const el = document.getElementById(mk.id);
    el.style.transform = '';
    el.style.transition = '';
    el.setAttribute('transform', `translate(${mk.cx},${mk.cy})`);
  });
}

// ─────────────────────────────────────────────
//  JUMP OFF ROCKS for finale (stand + slide rocks away)
// ─────────────────────────────────────────────
async function jumpOffRocksFinale() {
  const promises = MK_DATA.map((mk, i) => jumpToGround(mk.id, i * 100));
  await Promise.all(promises);
}

// ─────────────────────────────────────────────
//  MAIN ANIMATION SEQUENCE
// ─────────────────────────────────────────────
async function runShow() {
  // Setup
  document.getElementById('the-end').classList.remove('visible');
  document.getElementById('bg-madagascar').classList.add('active');
  initMeerkats();
  initMadChars();
  resetMkPositions();
  showRocks();
  clearAllAnim();
  hideFinaleText();
  stopMusic();
  stopNoteRain();

  // Make sure mad chars are hidden
  document.getElementById('mad-chars').setAttribute('display','none');
  document.getElementById('walk-group').setAttribute('display','none');

  // STEP 1: Meerkats lounging, gentle sway
  MK_DATA.forEach(mk => {
    const el = document.getElementById(mk.id);
    el.style.animation = 'lounge-sway 2.5s ease-in-out infinite';
    el.style.transformOrigin = '50% 60%';
  });
  await sleep(2000);

  // STEP 2: Center meerkat slowly looks up, blinks, looks around annoyed
  // Convert center to standing with animation
  const mk3el = document.getElementById('mk3');
  mk3el.style.animation = '';
  replaceWithStanding('mk3', {});
  mk3el.style.animation = 'mk-look-around 2s ease-in-out';
  await sleep(800);
  // Blink
  replaceWithStanding('mk3', { blink: true });
  await sleep(400);
  replaceWithStanding('mk3', {});
  await sleep(400);
  replaceWithStanding('mk3', { blink: true });
  await sleep(300);
  replaceWithStanding('mk3', {});
  mk3el.style.animation = 'mk-look-around 1.5s ease-in-out';
  await sleep(1500);

  // STEP 3: Center meerkat SLAMS hands on rock
  replaceWithStanding('mk3', { slam: true });
  mk3el.style.animation = 'mk-slam 0.4s ease-in-out';
  mk3el.style.transformOrigin = '50% 70%';
  playSlamSound();
  shakeStage();

  // Other meerkats startle with spiral eyes
  await sleep(150);
  ['mk1','mk2','mk4','mk5'].forEach(id => {
    setSpiralEyes(id);
    setAnim(id, 'mk-startle 0.5s ease-in-out');
  });
  await sleep(700);

  // STEP 4: SPEECH
  replaceWithStanding('mk3', {});
  mk3el.style.animation = 'mk-bounce 0.8s ease-in-out infinite';

  await say("I need... I just... I can't take this anymore!!", { rate: 0.95, pitch: 1.4 });

  // Others say Huh? and What?!
  ['mk1','mk2','mk4','mk5'].forEach(id => {
    const mk = MK_DATA.find(m => m.id === id);
    const el = document.getElementById(id);
    el.innerHTML = '';
    el.appendChild(drawMeerkat(mk.grad, mk.belly, { lounge: true }));
  });

  await say("Huh?", { rate: 0.9, pitch: 1.5 });
  await say("What?!", { rate: 1.0, pitch: 1.45 });
  await sleep(400);

  // STEP 5: "I need to... move it."
  mk3el.style.animation = 'mk-bounce 0.6s ease-in-out infinite';
  await say("I need to... move it.", { rate: 0.9, pitch: 1.4 });

  await say("What?!", { rate: 1.0, pitch: 1.5 });
  await say("Did he just say...?", { rate: 0.95, pitch: 1.45 });
  await sleep(300);

  // STEP 6: "I NEED TO MOVE IT! MOVE IT!" - bounces excitedly
  mk3el.style.animation = 'mk-bounce 0.3s ease-in-out infinite';
  await say("I NEED TO MOVE IT! MOVE IT!", { rate: 1.1, pitch: 1.5 });
  await sleep(300);

  // STEP 7: 5-second silence while others stare
  mk3el.style.animation = 'mk-pant 0.8s ease-in-out infinite';
  mk3el.style.transformOrigin = '50% 50%';
  await sleep(5000);

  // STEP 8: ROCKS SLIDE DOWN, Music starts, Center dances solo
  hideRocks();
  await sleep(400);
  startMusic();
  clearAllAnim();
  replaceWithStanding('mk3', {});
  mk3el.setAttribute('transform', `translate(400,${STAND_Y})`);
  setAnim('mk3', 'mk-dance 0.5s ease-in-out infinite');

  // Others still in lounge at their positions
  await sleep(3000);

  // STEP 9: 3-second pause — others stare
  // (meerkats still lounging, center dancing)
  await sleep(3000);

  // STEP 10: All 5 meerkats jump UP from rock positions, arc through air, LAND ON DIRT
  // First set all others to standing at original cy
  ['mk1','mk2','mk4','mk5'].forEach(id => {
    replaceWithStanding(id, {});
    const mk = MK_DATA.find(m => m.id === id);
    document.getElementById(id).setAttribute('transform', `translate(${mk.cx},${mk.cy})`);
  });

  // Jump all including center (re-do center with proper arc)
  const jumpPromises = MK_DATA.map((mk, i) => jumpToGround(mk.id, i * 80));
  await Promise.all(jumpPromises);

  // After landing — goofy dance on ground
  MK_DATA.forEach((mk, i) => {
    const anims = ['mk-goofy 0.55s ease-in-out infinite','mk-dance 0.5s ease-in-out infinite',
                   'mk-bounce 0.45s ease-in-out infinite','mk-goofy 0.6s ease-in-out infinite',
                   'mk-dance 0.52s ease-in-out infinite'];
    setAnim(mk.id, anims[i]);
  });
  await sleep(2500);

  // STEP 11: Side profile walking through biomes
  // Hide front-view meerkats temporarily
  document.getElementById('mk-group').setAttribute('display','none');
  clearAllAnim();
  stopMusic();
  await walkThroughBiomes();

  // STEP 12: Back to madagascar, front view. All panting.
  setBiome('madagascar');
  document.getElementById('mk-group').setAttribute('display','block');

  // All in standing position on ground
  MK_DATA.forEach(mk => {
    replaceWithStanding(mk.id, {});
    document.getElementById(mk.id).setAttribute('transform', `translate(${mk.cx},${STAND_Y})`);
  });
  clearAllAnim();
  MK_DATA.forEach(mk => setAnim(mk.id, 'mk-pant 0.6s ease-in-out infinite'));

  await say("Okay... I'm ready to snooze it now...", { rate: 0.85, pitch: 1.3 });
  await sleep(500);

  // STEP 13: ROCKS REAPPEAR, all jump back to rocks
  showRocks();
  await sleep(800);
  await jumpBackToRocks();

  // STEP 14: Getting comfortable (2s pause)
  MK_DATA.forEach(mk => {
    const el = document.getElementById(mk.id);
    el.style.animation = 'lounge-sway 2.5s ease-in-out infinite';
    el.style.transformOrigin = '50% 60%';
  });
  await sleep(2000);

  // STEP 15: Alex, Marty, Melman, Gloria BURST from behind rocks
  playCrashSound();
  shakeStage();
  await sleep(200);
  const madEl = document.getElementById('mad-chars');
  madEl.setAttribute('display','block');
  ['ch-alex','ch-marty','ch-melman','ch-gloria'].forEach((id, i) => {
    const el = document.getElementById(id);
    el.style.animation = `char-pop 0.6s ${i * 0.12}s cubic-bezier(.34,1.56,.64,1) both`;
    el.style.transformOrigin = '50% 80%';
  });

  await sleep(800);
  await say("We heard you guys like to MOVE IT!", { rate: 1.0, pitch: 1.0 });
  await sleep(200);
  await say("Can we move it... move it... WITH you?", { rate: 0.95, pitch: 1.05 });
  await sleep(300);

  // STEP 16: 3-second pause — everyone stares
  await sleep(3000);

  // STEP 17: Music restarts. Everyone dances wildly.
  // Meerkats jump off rocks (rocks slide away)
  hideRocks();
  await sleep(300);
  await jumpOffRocksFinale();
  await sleep(100);
  startMusic();
  danceFinaleAll();

  // STEP 17b: Music notes rain, finale text
  startNoteRain();
  await sleep(1200);
  showFinaleText("EVERYBODY MOVE IT MOVE IT!");
  await sleep(800);
  await say("EVERYBODY MOVE IT MOVE IT!", { rate: 1.15, pitch: 1.5 });
  await sleep(3000);

  hideFinaleText();
  stopNoteRain();
  stopMusic();

  // STEP 18: THE END
  document.getElementById('the-end').classList.add('visible');
}

// ─────────────────────────────────────────────
//  START BUTTON
// ─────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', () => {
  // Init AudioContext
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  // Preload voices
  if (window.speechSynthesis) {
    speechSynthesis.getVoices();
    // Trigger a silent utterance to unlock
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    speechSynthesis.speak(u);
  }

  // Hide start screen
  document.getElementById('start-screen').style.display = 'none';

  // Run the show
  runShow();
});

// ─────────────────────────────────────────────
//  WATCH AGAIN
// ─────────────────────────────────────────────
document.getElementById('watch-again').addEventListener('click', () => {
  document.getElementById('the-end').classList.remove('visible');
  stopMusic();
  stopNoteRain();
  hideFinaleText();
  if (speechSynthesis) speechSynthesis.cancel();

  // Reset everything
  resetMkPositions();
  showRocks();
  setBiome('madagascar');
  document.getElementById('mad-chars').setAttribute('display','none');
  document.getElementById('walk-group').setAttribute('display','none');
  document.getElementById('mk-group').setAttribute('display','block');
  clearAllAnim();
  ['ch-alex','ch-marty','ch-melman','ch-gloria'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.style.animation = ''; }
  });

  runShow();
});

//  INITIAL RENDER (so we see something before start)

initMeerkats();
initMadChars();
MK_DATA.forEach(mk => {
  const el = document.getElementById(mk.id);
  el.style.animation = 'lounge-sway 2.5s ease-in-out infinite';
  el.style.transformOrigin = '50% 60%';
});

</script>
